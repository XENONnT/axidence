[tool]
[tool.poetry]
name = "axidence"
version = "0.5.0+sr0"
description = "strax-based data-driven accidental coincidence background simulation and peak-level salting (SR0 compatibility release)"
readme = "README.md"
license = "BSD-3-Clause"
authors = [
  "Dacheng Xu, <dx2227@columbia.edu>",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: BSD License",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.8",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Physics",
]
repository = "https://github.com/XENONnT/axidence"
documentation = "https://readthedocs.org/projects/axidence/"

[tool.poetry.dependencies]
python = ">=3.8,<3.9"
strax = ">=1.2.3,<1.4"
straxen = ">=1.7.0,<2.0"
GOFevaluation = ">=0.1.5"

[build-system]
requires = ["poetry-core>=1.0.8", "setuptools>=61.0"]
build-backend = "poetry.core.masonry.api"
